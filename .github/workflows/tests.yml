# Runs on GitHub's machines, which have no Mathematica: every module and script
# must compile, and the recorder suites run with the tests that need a Wolfram
# kernel skipped. The full suites need Mathematica and run locally before a
# push (see docs/testing.md).
name: tests

on:
  push:
  pull_request:

jobs:
  without-mathematica:
    name: Python ${{ matrix.python }}, without Mathematica
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: Every module and script compiles
        run: python -W error::SyntaxWarning -m compileall -q src tests design/experiments
      - name: Recorder suites
        env:
          PYTHON: python
        run: tests/run_all.sh --no-kernel
