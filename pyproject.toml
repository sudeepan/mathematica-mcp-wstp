[project]
name = "mathematica-wstp-mcp"
version = "0.1.0"
description = "MCP server for Mathematica over WSTP: abortable evaluations, real liveness, supervised kernel process trees"
requires-python = ">=3.10"
dependencies = ["mcp>=2.0"]

[project.scripts]
mathematica-wstp = "mathematica_wstp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mathematica_wstp"]
